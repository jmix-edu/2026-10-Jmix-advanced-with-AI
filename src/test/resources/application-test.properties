main.datasource.url=jdbc:hsqldb:file:.jmix/hsqldb/ts_test;hsqldb.tx=mvcc
main.datasource.username=sa
main.datasource.password=

# Demo data seeder fills an empty database on startup; tests use their own data
timesheets.demo-data.enabled=false

reports.datasource.url=jdbc:hsqldb:file:.jmix/hsqldb/ts_reports_test;hsqldb.tx=mvcc
reports.datasource.username=sa
reports.datasource.password=

# Tests call scheduled work themselves
spring.quartz.auto-startup=false

# No LDAP in tests: a closed port, so sign-in never depends on the demo server
jmix.ldap.urls=ldap://localhost:1/

# What the dev profile gives the application and tests rely on (spec 04/01)
spring.mail.host=localhost
spring.mail.port=2525
jmix.email.from-address=timesheets@localhost
timesheets.public-url=http://localhost:8080
jmix.ldap.base-dn=dc=example,dc=org
jmix.core.session.maximum-sessions-per-user=100
jmix.ldap.manager-dn=cn=admin,dc=example,dc=org
# Never used: LDAP points to a closed port in tests
jmix.ldap.manager-password=unused
