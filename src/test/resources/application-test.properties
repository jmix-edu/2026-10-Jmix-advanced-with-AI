main.datasource.url=jdbc:hsqldb:file:.jmix/hsqldb/ts_test;hsqldb.tx=mvcc
main.datasource.username=sa
main.datasource.password=

# Сидер демо-данных заполняет пустую базу при старте; тесты используют свои данные
timesheets.demo-data.enabled=false

reports.datasource.url=jdbc:hsqldb:file:.jmix/hsqldb/ts_reports_test;hsqldb.tx=mvcc
reports.datasource.username=sa
reports.datasource.password=

# Тесты сами вызывают задачи по расписанию
spring.quartz.auto-startup=false

# В тестах нет LDAP: закрытый порт, поэтому вход никогда не зависит от демо-сервера
jmix.ldap.urls=ldap://localhost:1/

# То, что dev-профиль даёт приложению и на что опираются тесты (спека 04/01)
spring.mail.host=localhost
spring.mail.port=2525
jmix.email.from-address=timesheets@localhost
timesheets.public-url=http://localhost:8080
jmix.ldap.base-dn=dc=example,dc=org
jmix.core.session.maximum-sessions-per-user=100
jmix.ldap.manager-dn=cn=admin,dc=example,dc=org
# Не используется: в тестах LDAP указывает на закрытый порт
jmix.ldap.manager-password=unused

# Hot deploy Jmix Studio копирует изменённые классы запущенного приложения в .jmix/conf, и Jmix грузит классы
# оттуда. Тесты запускаются из того же каталога: они загрузили бы такой класс второй раз, в другом загрузчике
# классов ("Can not set WeekSheet field to WeekSheet"). Тесты берут классы только из сборки.
jmix.core.conf-dir=build/test-conf
