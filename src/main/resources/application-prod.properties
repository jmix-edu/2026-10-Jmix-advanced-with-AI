# Production (spec 04/01). Addresses and logins come from the environment, passwords from Vault
# (KV v2, secret/timesheets): main.datasource.password, reports.datasource.password,
# timesheets.admin.initial-password, jmix.ldap.manager-password, spring.mail.password.
# How to run: README, "Running in production".
spring.config.import=vault://
spring.cloud.vault.enabled=true
spring.cloud.vault.uri=${VAULT_URI}
# TOKEN (VAULT_TOKEN) by default; the Docker stack uses APPROLE (VAULT_ROLE_ID, VAULT_SECRET_ID), spec 04/02
spring.cloud.vault.authentication=${VAULT_AUTHENTICATION:TOKEN}
spring.cloud.vault.token=${VAULT_TOKEN:}
spring.cloud.vault.app-role.role-id=${VAULT_ROLE_ID:}
spring.cloud.vault.app-role.secret-id=${VAULT_SECRET_ID:}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
# Secrets are read once on startup
management.health.vault.enabled=false

main.datasource.url=${MAIN_DB_URL}
main.datasource.username=${MAIN_DB_USERNAME}

reports.datasource.url=${REPORTS_DB_URL}
reports.datasource.username=${REPORTS_DB_USERNAME}

# admin may not keep the password 'admin' (AdminPasswordInitializer)
timesheets.admin.require-initial-password=true

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
jmix.email.from-address=${MAIL_FROM}

timesheets.public-url=${TIMESHEETS_PUBLIC_URL}

jmix.ldap.urls=${LDAP_URLS}
jmix.ldap.base-dn=${LDAP_BASE_DN}
jmix.ldap.manager-dn=${LDAP_MANAGER_DN}

spring.output.ansi.enabled=never

# Quartz keeps jobs in PostgreSQL: the standard delegate cannot read their BYTEA data
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
