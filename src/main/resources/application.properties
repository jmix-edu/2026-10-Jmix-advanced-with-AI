main.datasource.url=jdbc:postgresql://localhost/ts_live
main.datasource.username=jmix
main.datasource.password=jmix

main.liquibase.change-log=com/company/timesheets/liquibase/changelog.xml

jmix.ui.login-view-id=ts_LoginView
jmix.ui.main-view-id=ts_MainView
jmix.ui.menu-config=com/company/timesheets/menu.xml
jmix.ui.composite-menu=false

main.liquibase.enabled=true

ui.login.defaultUsername=admin
ui.login.defaultPassword=admin

jmix.core.available-locales=en

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false

# Enable colors in logs
spring.output.ansi.enabled=always

# 'debug' level logs SQL generated by EclipseLink ORM
logging.level.eclipselink.logging.sql=info

# 'debug' level logs data store operations
logging.level.io.jmix.core.datastore=info

# 'debug' level logs access control constraints
logging.level.io.jmix.core.AccessLogger=debug

# 'debug' level logs all Jmix debug output
logging.level.io.jmix=info

# 'debug' or 'trace' levels help to troubleshoot security problems
logging.level.org.springframework.security=info

logging.level.org.atmosphere=warn

reports.datasource.url=jdbc:postgresql://localhost/ts_reports
reports.datasource.username=root
reports.datasource.password=root

reports.liquibase.change-log=com/company/timesheets/liquibase/reports-changelog.xml

jmix.core.additional-stores=reports
jmix.core.fetch-plans-config=com/company/timesheets/fetch-plans.xml

# Email: FakeSMTP locally (java -jar fakesmtp-2.0.jar -s -p 2525 -a 127.0.0.1), spec 03/03
spring.mail.host=localhost
spring.mail.port=2525
jmix.email.from-address=timesheets@localhost

# Self-registration: links in emails point here
timesheets.public-url=http://localhost:8080
timesheets.registration.activation-hours=24
# Contractor invitation links (spec 03/05)
timesheets.invitation.activation-days=7
# Quartz: remove registrations not activated in time, every hour (spec 03/04)
timesheets.registration.cleanup-cron=0 0 * * * ?


jmix.ldap.urls=ldap://localhost:1389/
jmix.ldap.base-dn=dc=example,dc=org
jmix.ldap.manager-dn=cn=admin,dc=example,dc=org
jmix.ldap.manager-password=admin
jmix.ldap.user-search-filter=(uid={0})
jmix.ldap.user-search-base=ou=users
jmix.ldap.group-search-base=ou=users
jmix.ldap.group-search-filter=(member={0})
jmix.ldap.member-attribute=member