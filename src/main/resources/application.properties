# Общие настройки всех профилей. Файлы профилей (spec 04/01):
# application-dev.properties  - локальная разработка, профиль по умолчанию
# application-prod.properties - продакшн, секреты из Vault
# Ни в этом файле, ни в файлах профилей секретов нет.
spring.application.name=timesheets
spring.profiles.default=dev

main.liquibase.change-log=com/company/timesheets/liquibase/changelog.xml
main.liquibase.enabled=true

jmix.ui.login-view-id=ts_LoginView
jmix.ui.main-view-id=ts_MainView
jmix.ui.menu-config=com/company/timesheets/menu.xml
jmix.ui.composite-menu=false

jmix.core.available-locales=en

# Уровень 'debug' логирует SQL, сгенерированный EclipseLink ORM
logging.level.eclipselink.logging.sql=info

# Уровень 'debug' логирует операции хранилищ данных
logging.level.io.jmix.core.datastore=info

# Уровень 'debug' логирует весь отладочный вывод Jmix
logging.level.io.jmix=info

# Уровни 'debug' и 'trace' помогают разбираться с проблемами безопасности
logging.level.org.springframework.security=info

logging.level.org.atmosphere=warn

reports.liquibase.change-log=com/company/timesheets/liquibase/reports-changelog.xml

jmix.core.additional-stores=reports
jmix.core.fetch-plans-config=com/company/timesheets/fetch-plans.xml

# Срок жизни ссылок саморегистрации (spec 03/03)
timesheets.registration.activation-hours=24
# Ссылки приглашений подрядчиков (spec 03/05)
timesheets.invitation.activation-days=7
# Quartz: раз в час удалять регистрации, не активированные вовремя (spec 03/04)
timesheets.registration.cleanup-cron=0 0 * * * ?

jmix.ldap.user-search-filter=(uid={0})
jmix.ldap.user-search-base=ou=users
jmix.ldap.group-search-base=ou=users
jmix.ldap.group-search-filter=(member={0})
jmix.ldap.member-attribute=member

jmix.ui.component.filter-auto-apply=true

# Vault читает только профиль prod
spring.cloud.vault.enabled=false

# Actuator: только health и info, открыты без входа (TimesheetsSecurityConfiguration)
management.endpoints.web.exposure.include=health,info
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
# Сбой почты или LDAP не делает приложение нездоровым
management.health.mail.enabled=false
management.health.ldap.enabled=false
# Spring Cloud (приходит с Vault) добавляет service discovery и refresh scope, приложению не нужно ни то, ни другое
management.health.refresh.enabled=false
spring.cloud.discovery.client.composite-indicator.enabled=false
spring.cloud.discovery.client.health-indicator.enabled=false
management.info.build.enabled=true
management.info.env.enabled=false
management.info.git.enabled=false
management.info.java.enabled=false
management.info.os.enabled=false
management.info.process.enabled=false
