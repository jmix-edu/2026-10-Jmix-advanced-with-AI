# Локальная разработка, профиль по умолчанию (spec 04/01).
# Учебный проект: запускается вообще без настроек. Локальные демо-учётки — значения по умолчанию ниже;
# окружение может их переопределить: DB_USERNAME, DB_PASSWORD, REPORTS_DB_USERNAME, REPORTS_DB_PASSWORD,
# LDAP_MANAGER_PASSWORD, UI_LOGIN_DEFAULT_PASSWORD. Продакшн-секреты отсюда не берутся (application-prod).
main.datasource.url=jdbc:postgresql://localhost/ts_live
main.datasource.username=${DB_USERNAME:jmix}
main.datasource.password=${DB_PASSWORD:jmix}

reports.datasource.url=jdbc:postgresql://localhost/ts_reports
reports.datasource.username=${REPORTS_DB_USERNAME:root}
reports.datasource.password=${REPORTS_DB_PASSWORD:root}

ui.login.defaultUsername=admin
ui.login.defaultPassword=${UI_LOGIN_DEFAULT_PASSWORD:admin}

# Демо-данные на пустой базе (DemoDataSeeder)
timesheets.demo-data.enabled=true

# Открывать браузер по умолчанию при запуске приложения в режиме разработки
vaadin.launch-browser=false

# Цветные логи
spring.output.ansi.enabled=always

# Уровень 'debug' логирует ограничения контроля доступа
logging.level.io.jmix.core.AccessLogger=debug

# Почта: локально FakeSMTP (java -jar fakesmtp-2.0.jar -s -p 2525 -a 127.0.0.1), spec 03/03
spring.mail.host=localhost
spring.mail.port=2525
jmix.email.from-address=timesheets@localhost

# Саморегистрация: ссылки в письмах ведут сюда
timesheets.public-url=http://localhost:8080

# Демо-сервер LDAP (ts-openldap), spec 03/06
jmix.ldap.urls=ldap://localhost:1389/
jmix.ldap.base-dn=dc=example,dc=org
jmix.ldap.manager-dn=cn=admin,dc=example,dc=org
jmix.ldap.manager-password=${LDAP_MANAGER_PASSWORD:admin}

jmix.core.session.maximum-sessions-per-user=100

# Quartz хранит задания в PostgreSQL: стандартный делегат не читает их данные BYTEA
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
