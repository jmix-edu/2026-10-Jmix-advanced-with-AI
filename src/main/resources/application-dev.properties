# Local development, the default profile (spec 04/01).
# Passwords come from the environment: DB_USERNAME, DB_PASSWORD, REPORTS_DB_PASSWORD, LDAP_MANAGER_PASSWORD,
# UI_LOGIN_DEFAULT_PASSWORD (optional, fills the login form).
main.datasource.url=jdbc:postgresql://localhost/ts_live
main.datasource.username=${DB_USERNAME}
main.datasource.password=${DB_PASSWORD}

reports.datasource.url=jdbc:postgresql://localhost/ts_reports
reports.datasource.username=${REPORTS_DB_USERNAME:root}
reports.datasource.password=${REPORTS_DB_PASSWORD}

ui.login.defaultUsername=admin
ui.login.defaultPassword=${UI_LOGIN_DEFAULT_PASSWORD:}

# Demo data on an empty database (DemoDataSeeder)
timesheets.demo-data.enabled=true

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false

# Enable colors in logs
spring.output.ansi.enabled=always

# 'debug' level logs access control constraints
logging.level.io.jmix.core.AccessLogger=debug

# Email: FakeSMTP locally (java -jar fakesmtp-2.0.jar -s -p 2525 -a 127.0.0.1), spec 03/03
spring.mail.host=localhost
spring.mail.port=2525
jmix.email.from-address=timesheets@localhost

# Self-registration: links in emails point here
timesheets.public-url=http://localhost:8080

# Demo LDAP server (ts-openldap), spec 03/06
jmix.ldap.urls=ldap://localhost:1389/
jmix.ldap.base-dn=dc=example,dc=org
jmix.ldap.manager-dn=cn=admin,dc=example,dc=org
jmix.ldap.manager-password=${LDAP_MANAGER_PASSWORD}

jmix.core.session.maximum-sessions-per-user=100

# Quartz keeps jobs in PostgreSQL: the standard delegate cannot read their BYTEA data
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
